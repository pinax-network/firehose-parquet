[package]
name = "firehose-parquet"
version = "0.1.0"
edition = "2021"
description = "Core library for converting Firehose gRPC streams to Apache Parquet"

[dependencies]
firehose-protos = { path = "../firehose-protos" }
arrow = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow"] }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots", "transport"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
tower = { version = "0.5", features = ["util"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow = "1"
time = "0.3"
thiserror = "2"
backoff = { version = "0.4", features = ["tokio"] }
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
