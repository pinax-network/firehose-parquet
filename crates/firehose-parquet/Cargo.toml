[package]
name = "firehose-parquet"
version = "0.1.0"
edition = "2021"
description = "Core library for converting Firehose gRPC streams to Apache Parquet"

[dependencies]
firehose-protos = { path = "../firehose-protos" }
arrow = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow"] }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots", "transport"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
time = "0.3"
thiserror = "2"
backoff = { version = "0.4", features = ["tokio"] }
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
