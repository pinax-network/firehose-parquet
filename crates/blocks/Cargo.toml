[package]
name = "blocks"
version = "0.1.0"
edition = "2021"
description = "Block type definitions for all Firehose chain types"

[lib]
name = "blocks"
path = "src/lib.rs"

[[bin]]
name = "firehose-to-parquet"
path = "src/bin/main.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow = { version = "58", features = ["prettyprint"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow = "1"
sha2 = "0.10"
