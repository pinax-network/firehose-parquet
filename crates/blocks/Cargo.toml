[package]
name = "blocks"
version = "0.1.0"
edition = "2021"
description = "Block type definitions for all Firehose chain types"

[lib]
name = "blocks"
path = "src/lib.rs"

[[bin]]
name = "firehose-evm-to-parquet"
path = "src/bin/evm.rs"

[[bin]]
name = "firehose-bitcoin-to-parquet"
path = "src/bin/bitcoin.rs"

[[bin]]
name = "firehose-solana-to-parquet"
path = "src/bin/solana.rs"

[[bin]]
name = "firehose-near-to-parquet"
path = "src/bin/near.rs"

[[bin]]
name = "firehose-antelope-to-parquet"
path = "src/bin/antelope.rs"

[[bin]]
name = "firehose-cosmos-to-parquet"
path = "src/bin/cosmos.rs"

[[bin]]
name = "firehose-tron-to-parquet"
path = "src/bin/tron.rs"

[[bin]]
name = "firehose-beacon-to-parquet"
path = "src/bin/beacon.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow = { version = "58", features = ["prettyprint"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
sha2 = "0.10"
