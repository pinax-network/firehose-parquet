[package]
name = "firehose-solana-to-parquet"
version = "0.1.0"
edition = "2021"
description = "CLI to convert Firehose Solana gRPC stream to Apache Parquet"

[[bin]]
name = "firehose-solana-to-parquet"
path = "src/main.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow = { version = "58", features = ["prettyprint"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
