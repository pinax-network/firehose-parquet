name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      # rust-toolchain.toml pins the toolchain and its components. With no
      # argument, `rustup toolchain install` installs exactly that one; relying
      # on auto-install is deprecated in rustup.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # blocks/tests/non_final_stream.rs runs the README's live-view SQL in
      # DuckDB, and blocks/tests/engine_compat.rs reads real output with it;
      # FIREPARQ_REQUIRE_DUCKDB makes a missing CLI fail instead of skip.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.1.1
          DUCKDB_SHA256: 7f3f1a26e98b3f1fcc673ffb81d2daf43c07689ed60e88173d6a4fd307f118ae
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  $RUNNER_TEMP/duckdb.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" -version
          echo "FIREPARQ_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          echo "FIREPARQ_REQUIRE_DUCKDB=1" >> "$GITHUB_ENV"

      # blocks/tests/engine_compat.rs also reads real output with Polars, pinned
      # with hashes in blocks/tests/engines/requirements.txt;
      # FIREPARQ_REQUIRE_POLARS makes a missing interpreter fail instead of skip.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Polars
        run: |
          python -m venv "$RUNNER_TEMP/polars"
          "$RUNNER_TEMP/polars/bin/pip" install --only-binary=:all: --require-hashes \
            -r blocks/tests/engines/requirements.txt
          "$RUNNER_TEMP/polars/bin/python" -c "import polars; print(polars.__version__)"
          echo "FIREPARQ_POLARS_PYTHON=$RUNNER_TEMP/polars/bin/python" >> "$GITHUB_ENV"
          echo "FIREPARQ_REQUIRE_POLARS=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          cargo test --workspace --locked
          cargo test -p blocks --example refresh_evm_golden --locked

      - name: Build fireparq binary
        run: cargo build --bin fireparq --locked

      - name: Verify shell completions
        run: |
          ./target/debug/fireparq completions bash > /dev/null
          ./target/debug/fireparq completions zsh > /dev/null
          ./target/debug/fireparq completions fish > /dev/null

  # Delta Lake spike (#643, docs/design/delta-lake.md). A standalone crate with
  # its own toolchain file (deltalake 1.0.0 needs Rust 1.94.1) and lockfile,
  # outside the workspace, so it changes nothing that `fireparq` builds. It
  # commits pre-written Parquet 60 parts to Delta tables on local disk, an
  # in-memory store and loopback S3, runs `deltalake` OPTIMIZE/VACUUM beside the
  # writer, and reads the result with DuckDB (1.1.1, the current pin, and 1.5.5,
  # the proposed one) and Polars. The delta extension is fetched at run time.
  delta-spike:
    name: Delta Lake spike (#643)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spikes/delta-lake
    steps:
      - uses: actions/checkout@v4

      - name: Install the spike's Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/delta-lake
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install DuckDB CLIs
        run: |
          install_duckdb() {
            curl -fsSL -o "$RUNNER_TEMP/duckdb-$1.zip" \
              "https://github.com/duckdb/duckdb/releases/download/$1/duckdb_cli-linux-amd64.zip"
            echo "$2  $RUNNER_TEMP/duckdb-$1.zip" | sha256sum --check
            unzip -q "$RUNNER_TEMP/duckdb-$1.zip" -d "$RUNNER_TEMP/duckdb-$1"
            "$RUNNER_TEMP/duckdb-$1/duckdb" -version
          }
          install_duckdb v1.1.1 7f3f1a26e98b3f1fcc673ffb81d2daf43c07689ed60e88173d6a4fd307f118ae
          install_duckdb v1.5.5 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the spike's Python packages
        run: |
          python -m venv "$RUNNER_TEMP/delta-spike"
          "$RUNNER_TEMP/delta-spike/bin/pip" install --only-binary=:all: --require-hashes \
            -r requirements.txt

      - name: Run the spike
        env:
          DELTA_SPIKE_PYTHON: ${{ runner.temp }}/delta-spike/bin/python
          DELTA_SPIKE_DUCKDB: ${{ runner.temp }}/duckdb-v1.5.5/duckdb
          DELTA_SPIKE_DUCKDB_SIGNED: ${{ runner.temp }}/duckdb-v1.1.1/duckdb
        run: ./run.sh

  # The pinned cargo-deny gate lives in advisories.yml, which also runs weekly
  # on its own schedule.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: ./.github/workflows/advisories.yml
