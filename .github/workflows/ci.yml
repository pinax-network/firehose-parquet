name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      # rust-toolchain.toml pins the toolchain and its components. With no
      # argument, `rustup toolchain install` installs exactly that one; relying
      # on auto-install is deprecated in rustup.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # blocks/tests/non_final_stream.rs runs the live-view SQL of
      # docs/non-final-streams.md in DuckDB, blocks/tests/sec_docs_sql.rs the
      # shipped views of docs/chains/sec.md, and blocks/tests/engine_compat.rs,
      # delta_tables.rs and delta_maintenance.rs read the Delta tables with
      # `delta_scan`, next to delta-rs (blocks/tests/common/mod.rs);
      # FIREPARQ_REQUIRE_DUCKDB makes a missing CLI fail instead of skip.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v2.0.1
          DUCKDB_SHA256: b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.tar.gz" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz"
          echo "${DUCKDB_SHA256}  $RUNNER_TEMP/duckdb.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/duckdb"
          tar -xzf "$RUNNER_TEMP/duckdb.tar.gz" -C "$RUNNER_TEMP/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" -version
          echo "FIREPARQ_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          echo "FIREPARQ_REQUIRE_DUCKDB=1" >> "$GITHUB_ENV"

      # The delta extension is pinned by checksum: DuckDB's extension
      # repository serves one build per DuckDB version and platform, and has no
      # versioned URLs for core extensions. The tests load it from
      # FIREPARQ_DUCKDB_EXTENSION_DIR and check FIREPARQ_DUCKDB_DELTA_VERSION;
      # LOAD also verifies DuckDB's signature. If the repository replaces the
      # build, this step fails: record the new checksum and version here.
      - name: Install the DuckDB delta extension
        env:
          DELTA_EXTENSION_VERSION: f41762b37b
          DELTA_EXTENSION_SHA256: cb4b3a1f43a2a9d9fb57cfdfc587fbdc0895a1041ad255533eb56dc047a2e2c5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/delta.duckdb_extension.gz" \
            "https://extensions.duckdb.org/v2.0.1/linux_amd64/delta.duckdb_extension.gz"
          echo "${DELTA_EXTENSION_SHA256}  $RUNNER_TEMP/delta.duckdb_extension.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/delta.duckdb_extension.gz"
          "$FIREPARQ_DUCKDB" -c "SET extension_directories = ['$RUNNER_TEMP/duckdb-extensions'];
            INSTALL '$RUNNER_TEMP/delta.duckdb_extension'; LOAD delta;
            SELECT extension_name, extension_version, install_mode
            FROM duckdb_extensions() WHERE extension_name = 'delta';"
          echo "FIREPARQ_DUCKDB_EXTENSION_DIR=$RUNNER_TEMP/duckdb-extensions" >> "$GITHUB_ENV"
          echo "FIREPARQ_DUCKDB_DELTA_VERSION=${DELTA_EXTENSION_VERSION}" >> "$GITHUB_ENV"

      # The repository is Rust-only: no Python is installed. The Delta tests
      # read through delta-rs snapshots (blocks/tests/common/mod.rs) and run
      # the maintenance job, `fireparq maintenance` (maintenance/). Nothing
      # links DataFusion: the compaction is the maintenance crate's own.
      - name: Check that the repository is Rust-only
        run: |
          if git ls-files | grep -E '\.py$|requirements.*\.txt$'; then
            echo "::error::the repository is Rust-only; see docs/audit/rust-only.md"
            exit 1
          fi

      - name: Check that nothing links DataFusion
        run: |
          if cargo tree --locked --workspace --prefix none | grep -E '^datafusion'; then
            echo "::error::the workspace depends on DataFusion; fireparq (maintenance included) must not"
            exit 1
          fi

      - name: Run tests
        run: |
          cargo test --workspace --locked
          cargo test -p blocks --example refresh_evm_golden --locked
          cargo test -p blocks --example refresh_sec_golden --locked

      - name: Build fireparq binary
        run: cargo build --bin fireparq --locked

      - name: Verify shell completions
        run: |
          ./target/debug/fireparq completions bash > /dev/null
          ./target/debug/fireparq completions zsh > /dev/null
          ./target/debug/fireparq completions fish > /dev/null

  # The pinned cargo-deny gate lives in advisories.yml, which also runs weekly
  # on its own schedule.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: ./.github/workflows/advisories.yml
