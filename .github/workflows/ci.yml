name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: |
          cargo test --workspace --locked
          cargo test -p blocks --example refresh_evm_golden --locked

      - name: Build fireparq binary
        run: cargo build --bin fireparq --locked

      - name: Verify shell completions
        run: |
          ./target/debug/fireparq completions bash > /dev/null
          ./target/debug/fireparq completions zsh > /dev/null
          ./target/debug/fireparq completions fish > /dev/null

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    env:
      # Pinned release binary, verified against the release asset digest for
      # cargo-deny-<version>-x86_64-unknown-linux-musl.tar.gz.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "${archive}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${archive}.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${archive}/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Advisories only (deny.toml): fails on any RustSec vulnerability in the
      # locked graph, and on unsound/unmaintained direct dependencies, unless
      # the advisory is ignored in deny.toml with a recorded reason.
      - name: Check dependency advisories
        run: cargo deny --locked check advisories
