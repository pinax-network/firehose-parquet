name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      # rust-toolchain.toml pins the toolchain and its components. With no
      # argument, `rustup toolchain install` installs exactly that one; relying
      # on auto-install is deprecated in rustup.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # blocks/tests/non_final_stream.rs runs the README's live-view SQL in
      # DuckDB, and blocks/tests/engine_compat.rs, delta_tables.rs and
      # delta_maintenance.rs read the Delta tables with `delta_scan`
      # (blocks/tests/common/mod.rs); FIREPARQ_REQUIRE_DUCKDB makes a missing
      # CLI fail instead of skip.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
          DUCKDB_SHA256: 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  $RUNNER_TEMP/duckdb.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" -version
          echo "FIREPARQ_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          echo "FIREPARQ_REQUIRE_DUCKDB=1" >> "$GITHUB_ENV"

      # The delta extension is pinned by checksum: DuckDB's extension
      # repository serves one build per DuckDB version and platform, and has no
      # versioned URLs for core extensions. The tests load it from
      # FIREPARQ_DUCKDB_EXTENSION_DIR and check FIREPARQ_DUCKDB_DELTA_VERSION;
      # LOAD also verifies DuckDB's signature. If the repository replaces the
      # build, this step fails: record the new checksum and version here.
      - name: Install the DuckDB delta extension
        env:
          DELTA_EXTENSION_VERSION: 45c4087
          DELTA_EXTENSION_SHA256: c8ce674cd61a395d88f2759e191186ab496714058f3fcf55ee86338780af90e9
        run: |
          curl -fsSL -o "$RUNNER_TEMP/delta.duckdb_extension.gz" \
            "https://extensions.duckdb.org/v1.5.5/linux_amd64/delta.duckdb_extension.gz"
          echo "${DELTA_EXTENSION_SHA256}  $RUNNER_TEMP/delta.duckdb_extension.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/delta.duckdb_extension.gz"
          "$FIREPARQ_DUCKDB" -c "SET extension_directory = '$RUNNER_TEMP/duckdb-extensions';
            INSTALL '$RUNNER_TEMP/delta.duckdb_extension'; LOAD delta;
            SELECT extension_name, extension_version, install_mode
            FROM duckdb_extensions() WHERE extension_name = 'delta';"
          echo "FIREPARQ_DUCKDB_EXTENSION_DIR=$RUNNER_TEMP/duckdb-extensions" >> "$GITHUB_ENV"
          echo "FIREPARQ_DUCKDB_DELTA_VERSION=${DELTA_EXTENSION_VERSION}" >> "$GITHUB_ENV"

      # The Delta tests also read with Polars `scan_delta` and run
      # scripts/delta_maintenance.py with `deltalake`, both pinned with hashes
      # in blocks/tests/engines/requirements.txt; FIREPARQ_REQUIRE_POLARS makes
      # a missing interpreter fail instead of skip.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Polars and deltalake
        run: |
          python -m venv "$RUNNER_TEMP/polars"
          "$RUNNER_TEMP/polars/bin/pip" install --only-binary=:all: --require-hashes \
            -r blocks/tests/engines/requirements.txt
          "$RUNNER_TEMP/polars/bin/python" -c "import polars, deltalake; print(polars.__version__, deltalake.__version__)"
          echo "FIREPARQ_POLARS_PYTHON=$RUNNER_TEMP/polars/bin/python" >> "$GITHUB_ENV"
          echo "FIREPARQ_REQUIRE_POLARS=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          cargo test --workspace --locked
          cargo test -p blocks --example refresh_evm_golden --locked

      - name: Build fireparq binary
        run: cargo build --bin fireparq --locked

      - name: Verify shell completions
        run: |
          ./target/debug/fireparq completions bash > /dev/null
          ./target/debug/fireparq completions zsh > /dev/null
          ./target/debug/fireparq completions fish > /dev/null

  # The pinned cargo-deny gate lives in advisories.yml, which also runs weekly
  # on its own schedule.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: ./.github/workflows/advisories.yml
