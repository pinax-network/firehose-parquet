name: Dependency advisories

# The RustSec advisory gate. ci.yml calls it on every push and pull request; the
# weekly schedule also catches advisories published against an unchanged
# Cargo.lock. Only this check runs on the schedule, never the full build.
on:
  workflow_call:
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned release binary, verified against the release asset digest for
      # cargo-deny-<version>-x86_64-unknown-linux-musl.tar.gz.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "${archive}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${archive}.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${archive}/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Advisories only (deny.toml): fails on any RustSec vulnerability in the
      # locked graph, and on unsound/unmaintained direct dependencies, unless
      # the advisory is ignored in deny.toml with a recorded reason.
      - name: Check dependency advisories
        run: cargo deny --locked check advisories
