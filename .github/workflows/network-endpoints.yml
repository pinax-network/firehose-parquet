name: Network endpoints

# Checks that every built-in `--network` endpoint still answers, so the
# generated registry does not go stale silently. Kept out of ci.yml because it
# needs network access to third-party hosts.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - firehose-parquet/src/networks_generated.rs
      - scripts/check_network_endpoints.sh
      - .github/workflows/network-endpoints.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check built-in network endpoints
        run: ./scripts/check_network_endpoints.sh
