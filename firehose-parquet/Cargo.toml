[package]
name = "firehose-parquet"
version.workspace = true
edition.workspace = true
description = "Core library for converting Firehose gRPC streams to Apache Parquet"

[[bin]]
name = "generate-networks"
path = "../scripts/generate_networks.rs"

[dependencies]
async-trait = "0.1"
firehose-protos = { path = "../firehose-protos" }
arrow.workspace = true
arrow-schema = { version = "60", features = ["serde"] }
parquet = { version = "60", features = ["arrow"] }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots", "transport", "gzip", "zstd"] }
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt", "io"] }
clap.workspace = true
clap_complete = "4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
backoff = { version = "0.4", features = ["tokio"] }
hex = "0.4"
bs58 = "0.5"
sha2.workspace = true
prometheus-client.workspace = true
object_store = { version = "0.12", features = ["aws"] }
futures = "0.3"
bytes = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tiny-keccak = { version = "2", features = ["keccak"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serial_test = "3"
tonic-prost = "0.14"
