[package]
name = "firehose-parquet"
version.workspace = true
edition.workspace = true
description = "Core library for converting Firehose gRPC streams to Apache Parquet"

[dependencies]
firehose-protos = { path = "../firehose-protos" }
arrow.workspace = true
parquet = { version = "58", features = ["arrow"] }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots", "transport", "gzip"] }
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete = "4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow.workspace = true
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
backoff = { version = "0.4", features = ["tokio"] }
hex = "0.4"
bs58 = "0.5"
sha2.workspace = true
prometheus-client.workspace = true
object_store = { version = "0.12", features = ["aws"] }
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
