# Example Kubernetes CronJobs for the HyperLiquid reference tables, to adopt in
# a deployment repository. They run `fireparq hypercore-reference` (crate
# reference/), the writer's binary and image, three jobs that snapshot
# HyperLiquid's /info into the append-only hl_* Delta tables beside a
# HyperCore lake. See docs/hypercore-reference.md.
#
# Placeholders: the namespace `reference`, the bucket `hypercore-ref`, the
# endpoint `https://rgw.example.internal` and the Secrets
# `hypercore-ref-writer` and (optional) `hypercore-ref-info-url`.
#
# 1. A bucket of its own: never a fireparq dataset root, whose `build` would
#    then refuse to resume. Never versioned.
# 2. Credentials: an S3 user for these jobs only, limited to Get, Put, Delete
#    and AbortMultipartUpload under each hl_* table prefix and `_hlref/`,
#    listings with a prefix under one of those, and bulk deletes; never the
#    bucket root or its configuration (docs/hypercore-reference.md, "The S3
#    user").
#
#      kubectl -n reference create secret generic hypercore-ref-writer \
#        --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#
#    To read /info through another endpoint whose URL holds a key, also
#    create `hypercore-ref-info-url` with HL_INFO_URL (only its host is ever
#    logged). Without it, or with an empty value, the jobs use
#    https://api.hyperliquid.xyz/info.
# 3. `kubectl -n reference apply -f deploy/examples/hypercore-reference-cronjob.yaml`
#
# The image is the writer's, ghcr.io/pinax-network/firehose-parquet, whose
# ENTRYPOINT is `fireparq`; the subcommand exists from 1.3.0 on. The root
# filesystem is read-only, /tmp is an emptyDir, and the jobs run as an
# unprivileged user (65534). It replaces the Python job of k8s-parquet PR #82
# (image ghcr.io/pinax-network/hypercore-reference, never published), which
# read S3_ENDPOINT: these jobs read AWS_ENDPOINT_URL_S3, and refuse a
# differing S3_ENDPOINT.
#
# Each job is the only writer of its tables, and its commits fail rather than
# append on top of a concurrent commit, so overlapping runs never duplicate a
# row (Forbid prevents them). A run that ends its time budget commits and
# exits 0; the next run continues, which is how the backfills progress. A
# failed request or commit exits 1 (the rows completed before it are
# committed), a configuration error 2; the next run is the retry
# (backoffLimit 0). Each run compacts and, once a day, vacuums its own tables.
# A request can outlast the time budget by its 300 s timeout, so every
# deadline is at least the budget plus 300 s. Alert on the CronJobs' last
# successful time: there are no metrics.
#
# /info budgets: HyperLiquid allows 1200 weight per minute per IP. These three
# take at most 400 + 200 + 400 when they all run at once (backfill); steady
# state is far lower.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypercore-ref-settings
  namespace: reference
data:
  HLREF_ROOT: s3://hypercore-ref
  AWS_ENDPOINT_URL_S3: https://rgw.example.internal
  AWS_REGION: us-east-1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hypercore-ref-outcomes
  namespace: reference
spec:
  # outcomeMeta every 5 minutes, then up to HLREF_MAX_PROBES settledOutcome
  # probes: outcomes that left outcomeMeta first, then every id never seen,
  # newest first. Until the sweep reaches outcome 0 (the HIP-4 backfill, about
  # 10,000 ids at 60 a run: about 14 h) each run uses its whole budget.
  schedule: "2-59/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # the next run is the retry
      activeDeadlineSeconds: 600 # above the 200 s budget + 300 s request timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hypercore-reference
            app.kubernetes.io/component: outcomes
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: outcomes
              # `fireparq` is the ENTRYPOINT. Pin the digest of the release's
              # image in production, the writer's.
              image: ghcr.io/pinax-network/firehose-parquet:1.3.0
              args: ["hypercore-reference", "outcomes"]
              envFrom:
                - configMapRef:
                    name: hypercore-ref-settings
                - secretRef:
                    name: hypercore-ref-writer
                - secretRef:
                    name: hypercore-ref-info-url
                    optional: true
              env:
                - name: HLREF_WEIGHT_PER_MINUTE
                  value: "400"
                - name: HLREF_TIME_BUDGET_SECONDS
                  value: "200"
                - name: HLREF_MAX_PROBES
                  value: "60"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 1Gi
                  ephemeral-storage: 1Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hypercore-ref-meta
  namespace: reference
spec:
  # Hourly: spotMeta, perpDexs and allPerpMetas (spot tokens and pairs, perp
  # dexes and assets), and tokenDetails once per new token. The first runs
  # fetch tokenDetails for every listed token (some answer HTTP 500 every
  # time); a token without details is asked again once a day, in its own
  # hour, with one attempt.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300 # above the 2700 s budget + 300 s request timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hypercore-reference
            app.kubernetes.io/component: meta
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: meta
              image: ghcr.io/pinax-network/firehose-parquet:1.3.0
              args: ["hypercore-reference", "meta"]
              envFrom:
                - configMapRef:
                    name: hypercore-ref-settings
                - secretRef:
                    name: hypercore-ref-writer
                - secretRef:
                    name: hypercore-ref-info-url
                    optional: true
              env:
                - name: HLREF_WEIGHT_PER_MINUTE
                  value: "200"
                - name: HLREF_TIME_BUDGET_SECONDS
                  value: "2700"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 1Gi
                  ephemeral-storage: 1Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hypercore-ref-funding
  namespace: reference
spec:
  # Hourly, after the HH:00 funding block: fundingHistory for every perp coin
  # of every dex (each delisted coin once a day, in its own hour), each
  # resumed after its latest stored hour. A coin with none starts at
  # 2026-01-01: the first runs are the backfill.
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3300 # above the 2700 s budget + 300 s request timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hypercore-reference
            app.kubernetes.io/component: funding
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: funding
              image: ghcr.io/pinax-network/firehose-parquet:1.3.0
              args: ["hypercore-reference", "funding"]
              envFrom:
                - configMapRef:
                    name: hypercore-ref-settings
                - secretRef:
                    name: hypercore-ref-writer
                - secretRef:
                    name: hypercore-ref-info-url
                    optional: true
              env:
                - name: HLREF_WEIGHT_PER_MINUTE
                  value: "400"
                - name: HLREF_TIME_BUDGET_SECONDS
                  value: "2700"
              # The funding history grows by millions of rows a year; a run
              # reads its (coin, funding_time) columns and compacts it.
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
