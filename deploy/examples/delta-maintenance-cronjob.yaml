# Example Kubernetes CronJobs for the Delta maintenance job (#643), to adopt in
# a deployment repository. They run `fireparq maintenance` (crate
# maintenance/, with delta-rs `deltalake-core` 1.0.0), the same binary and
# version as the writer, beside a running `fireparq build`
# on one network bucket: hourly OPTIMIZE of closed dates, lite VACUUM, a
# checkpoint and log cleanup, and a weekly full VACUUM with the enforced 168 h
# retention. See docs/delta-maintenance.md and docs/design/delta-lake.md §9.
#
# Placeholders: the namespace `lake`, the bucket `ethereum-mainnet`, the
# endpoint `https://rgw.example.internal` and the Secret `delta-maintenance-s3`.
#
# 1. Credentials: an RGW (S3) user for maintenance only, limited to Get, Put,
#    Delete and List on `<table>/_delta_log/*` and the table data prefixes,
#    with no access to `.fireparq-ingest/`, `_fireparq/` or the owner record
#    (design §5). Never the writer's credentials.
#
#      kubectl -n lake create secret generic delta-maintenance-s3 \
#        --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# 2. `kubectl -n lake apply -f deploy/examples/delta-maintenance-cronjob.yaml`
#
# The image is the writer's, ghcr.io/pinax-network/firehose-parquet, whose
# ENTRYPOINT is `fireparq`: the container's `args` select the subcommand. The
# root filesystem is read-only, /tmp is an emptyDir, and the job runs as an
# unprivileged user (65534). Up to v1.0.7 the job was a separate image,
# ghcr.io/pinax-network/firehose-parquet-maintenance, with the same settings.
#
# A run that fails or loses a commit race changes nothing that the next run
# cannot finish, and the writer is never affected. A table the writer has not
# created yet is skipped, not failed. Alert on the writer's
# `firehose_parquet_delta_log_tail_commits` growing past a few hundred: the
# hourly checkpoints have stopped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-maintenance-settings
  namespace: lake
data:
  LAKE_BUCKET: ethereum-mainnet
  # Every table of the network's block type (docs/schemas/evm.md for EVM).
  LAKE_TABLES: >-
    blocks,transactions,logs,withdrawals,access_lists,set_code_authorizations,
    calls,balance_changes,code_changes,storage_changes,nonce_changes,gas_changes,
    account_creations,system_calls,system_balance_changes,system_code_changes,
    system_storage_changes,system_nonce_changes,system_gas_changes,
    system_account_creations
  S3_ENDPOINT: https://rgw.example.internal
  AWS_REGION: us-east-1
  AWS_ALLOW_HTTP: "false"
  # Days per table a run sorts back into the writer's row order (days an
  # OPTIMIZE up to 1.0.5 left out of it); new days are only concatenated.
  OPTIMIZE_REPAIR_DATES: "1"
  # VACUUM_RETENTION_HOURS (default the table's 7 days): lower deletes replaced
  # files sooner, but then every run deletes them again until their tombstones
  # expire. With a lower value, set VACUUM=0 on the hourly job and VACUUM once a
  # day (docs/delta-maintenance.md, "VACUUM retention and schedule").
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delta-maintenance
  namespace: lake
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # the next hourly run is the retry
      # A day's repair into the writer's row order commits a table's day all
      # or nothing, and takes about 90 min on BSC (calls alone 44): leave runs
      # the time for one, or every run is killed in the same table.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: delta-maintenance
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              # `fireparq` is the ENTRYPOINT. Pin the digest of the release's
              # image in production, the writer's.
              image: ghcr.io/pinax-network/firehose-parquet:1.1.2
              args: ["maintenance"]
              envFrom:
                - configMapRef:
                    name: delta-maintenance-settings
                - secretRef:
                    name: delta-maintenance-s3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 4Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
---
# Weekly full VACUUM: also deletes untracked files older than the enforced
# 168 h retention (files of a failed OPTIMIZE), but never a table's top-level
# metadata/ (Iceberg metadata of an XTable sync). It runs half an hour away from
# the hourly job; an overlap is safe (a lost commit race is retried next run),
# only wasteful.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delta-maintenance-full-vacuum
  namespace: lake
spec:
  schedule: "47 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # the next weekly run is the retry
      # Every run compacts first, so a full VACUUM run may repair a day too.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: delta-maintenance-full-vacuum
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              # `fireparq` is the ENTRYPOINT. Pin the digest of the release's
              # image in production, the writer's.
              image: ghcr.io/pinax-network/firehose-parquet:1.1.2
              args: ["maintenance"]
              env:
                - name: FULL_VACUUM
                  value: "1"
                # A full VACUUM refuses less than 168 h: this overrides a lower
                # VACUUM_RETENTION_HOURS in the shared settings.
                - name: VACUUM_RETENTION_HOURS
                  value: "168"
              envFrom:
                - configMapRef:
                    name: delta-maintenance-settings
                - secretRef:
                    name: delta-maintenance-s3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 4Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
