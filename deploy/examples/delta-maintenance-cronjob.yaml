# Example Kubernetes CronJobs for the Delta maintenance job (#643), to adopt in
# a deployment repository. They run `fireparq-maintenance`, the Rust binary
# of delta-rs's own operations (`deltalake-core` 1.0.0; crate maintenance/),
# beside a running `fireparq build`
# on one network bucket: hourly OPTIMIZE of closed dates, lite VACUUM, a
# checkpoint and log cleanup, and a weekly full VACUUM with the enforced 168 h
# retention. See README "Delta maintenance" and docs/design/delta-lake.md §9.
#
# Placeholders: the namespace `lake`, the bucket `ethereum-mainnet`, the
# endpoint `https://rgw.example.internal` and the Secret `delta-maintenance-s3`.
#
# 1. Credentials: an RGW (S3) user for maintenance only, limited to Get, Put,
#    Delete and List on `<table>/_delta_log/*` and the table data prefixes,
#    with no access to `.fireparq-ingest/`, `_fireparq/` or the owner record
#    (design §5). Never the writer's credentials.
#
#      kubectl -n lake create secret generic delta-maintenance-s3 \
#        --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# 2. `kubectl -n lake apply -f deploy/examples/delta-maintenance-cronjob.yaml`
#
# The image ghcr.io/pinax-network/firehose-parquet-maintenance is published
# with each fireparq release (deploy/maintenance/Dockerfile): the
# fireparq-maintenance binary on debian-slim, as its ENTRYPOINT, so no
# `command:` is needed and the pod needs no Python or package index (images up
# to v1.0.1 ran the former Python job with the same settings). The root
# filesystem is read-only, /tmp is an emptyDir, and the job runs as an
# unprivileged user (65534).
#
# A run that fails or loses a commit race changes nothing that the next run
# cannot finish, and the writer is never affected. A table the writer has not
# created yet is skipped, not failed. Alert on the writer's
# `firehose_parquet_delta_log_tail_commits` growing past a few hundred: the
# hourly checkpoints have stopped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delta-maintenance-settings
  namespace: lake
data:
  LAKE_BUCKET: ethereum-mainnet
  # Every table of the network's block type (docs/schemas/evm.md for EVM).
  LAKE_TABLES: >-
    blocks,transactions,logs,withdrawals,access_lists,set_code_authorizations,
    calls,balance_changes,code_changes,storage_changes,nonce_changes,gas_changes,
    account_creations,system_calls,system_balance_changes,system_code_changes,
    system_storage_changes,system_nonce_changes,system_gas_changes,
    system_account_creations
  S3_ENDPOINT: https://rgw.example.internal
  AWS_REGION: us-east-1
  AWS_ALLOW_HTTP: "false"
  # Bounds OPTIMIZE's memory: each task compacts one bin of up to
  # delta.targetFileSize (256 MiB).
  OPTIMIZE_MAX_CONCURRENT_TASKS: "2"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delta-maintenance
  namespace: lake
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # the next hourly run is the retry
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: delta-maintenance
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              # The fireparq-maintenance binary is the ENTRYPOINT
              # (deploy/maintenance/Dockerfile). Pin the digest of the release's
              # image in production.
              image: ghcr.io/pinax-network/firehose-parquet-maintenance:1.0.2
              envFrom:
                - configMapRef:
                    name: delta-maintenance-settings
                - secretRef:
                    name: delta-maintenance-s3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 4Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
---
# Weekly full VACUUM: also deletes untracked files older than the enforced
# 168 h retention (files of a failed OPTIMIZE). It runs half an hour away from
# the hourly job; an overlap is safe (a lost commit race is retried next run),
# only wasteful.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delta-maintenance-full-vacuum
  namespace: lake
spec:
  schedule: "47 3 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # the next weekly run is the retry
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: delta-maintenance-full-vacuum
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              # The fireparq-maintenance binary is the ENTRYPOINT
              # (deploy/maintenance/Dockerfile). Pin the digest of the release's
              # image in production.
              image: ghcr.io/pinax-network/firehose-parquet-maintenance:1.0.2
              env:
                - name: FULL_VACUUM
                  value: "1"
              envFrom:
                - configMapRef:
                    name: delta-maintenance-settings
                - secretRef:
                    name: delta-maintenance-s3
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 4Gi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
