[package]
name = "fireparq-maintenance"
version.workspace = true
edition.workspace = true
description = "Delta maintenance of a fireparq lake (`fireparq maintenance`): order-keeping compaction, VACUUM, checkpoints and log cleanup"

[lib]
name = "fireparq_maintenance"
path = "src/lib.rs"

[dependencies]
# delta-rs (#643 design §9): VACUUM, checkpoints, its Parquet file writer and
# commits, as `firehose-parquet` builds it. No `datafusion`: the compaction is
# this crate's own (src/compact.rs), and `fireparq`, which links this crate for
# `fireparq maintenance`, must not link DataFusion (CI checks it).
deltalake-core = { version = "=1.0.0", default-features = false, features = ["rustls"] }
# delta-rs's object_store major, as in `firehose-parquet`'s Delta log store.
object_store = { version = "0.13.2", features = ["aws"] }
# The `Bytes` of the Parquet reader the compaction reads files with.
bytes = "1"
chrono = { version = "0.4", default-features = false }
futures = "0.3"
serde_json = "1"
tokio.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"
