[package]
name = "fireparq-maintenance"
version.workspace = true
edition.workspace = true
description = "Delta maintenance job for a fireparq lake: OPTIMIZE, VACUUM, checkpoints and log cleanup"

[lib]
name = "fireparq_maintenance"
path = "src/lib.rs"

[[bin]]
name = "fireparq-maintenance"
path = "src/main.rs"

[dependencies]
# delta-rs's own operations (#643 design §9). `datafusion` is required by
# OPTIMIZE and brings DataFusion 55, the version deltalake-core 1.0.0 is built
# on. Only this crate enables it: the writer (`blocks`, `firehose-parquet`)
# must not link DataFusion, and CI checks that with `cargo tree -p blocks`.
deltalake-core = { version = "=1.0.0", default-features = false, features = ["rustls", "datafusion"] }
# delta-rs's object_store major, as in `firehose-parquet`'s Delta log store.
object_store = { version = "0.13.2", features = ["aws"] }
chrono = { version = "0.4", default-features = false }
serde_json = "1"
tokio.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"
