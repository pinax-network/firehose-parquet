syntax = "proto3";
package cosmos.tx.v1beta1;

import "google/protobuf/any.proto";

// Wire-compatible subset of Cosmos SDK tx.proto at
// cosmos/cosmos-sdk@3431b5f3aba96dbb1d0d622081a8de2a610229af.
// Decode the real TxRaw envelope first: repeated singular bytes are last-wins,
// unlike repeated embedded messages, which merge. Optional preserves presence.
message TxRaw {
  optional bytes body_bytes = 1;
  optional bytes auth_info_bytes = 2;
  repeated bytes signatures = 3;
}

// Internal decoded representation. Hash the source TxRaw, never a re-encoding.
message Tx {
  TxBody body = 1;
  AuthInfo auth_info = 2;
  repeated bytes signatures = 3;
}

message TxBody {
  repeated google.protobuf.Any messages = 1;
  string memo = 2;
  uint64 timeout_height = 3;
}

message AuthInfo {
  repeated SignerInfo signer_infos = 1;
  Fee fee = 2;
}

message SignerInfo {
  google.protobuf.Any public_key = 1;
  // Keep all wire occurrences of the singular embedded ModeInfo. Concatenating
  // them preserves protobuf message-merge semantics without interpreting it.
  // Zero occurrences distinguish absent from a present empty submessage.
  repeated bytes mode_info = 2;
  uint64 sequence = 3;
}

message Fee {
  repeated Coin amount = 1;
  uint64 gas_limit = 2;
  string payer = 3;
  string granter = 4;
}

// Wire-compatible subset of cosmos.base.v1beta1.Coin.
message Coin {
  string denom = 1;
  string amount = 2;
}
