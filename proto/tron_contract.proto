syntax = "proto3";
package protocol;

// Wire-compatible projections of these three messages from tronprotocol/protocol
// revision 2a678934da3992b1a67f975769bbb2d31989451f:
// core/contract/{balance_contract,asset_issue_contract,smart_contract}.proto.
// Other Any payloads remain opaque in the contracts table.
message TransferContract {
  bytes owner_address = 1;
  bytes to_address = 2;
  int64 amount = 3;
}
message TransferAssetContract {
  bytes asset_name = 1;
  bytes owner_address = 2;
  bytes to_address = 3;
  int64 amount = 4;
}
message TriggerSmartContract {
  bytes owner_address = 1;
  bytes contract_address = 2;
  int64 call_value = 3;
  bytes data = 4;
  int64 call_token_value = 5;
  int64 token_id = 6;
}
