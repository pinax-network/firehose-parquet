syntax = "proto3";
package cosmos.tx.v1beta1;

import "google/protobuf/any.proto";

// Minimal Tx definition for extracting messages from raw Cosmos transaction bytes.
message Tx {
  TxBody body = 1;
}

message TxBody {
  repeated google.protobuf.Any messages = 1;
  string memo = 2;
  uint64 timeout_height = 3;
}
