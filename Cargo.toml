[workspace]
resolver = "2"
members = [
    "firehose-protos",
    "firehose-parquet",
    "blocks",
]

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
arrow = { version = "58", features = ["prettyprint"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
anyhow = "1"
sha2 = "0.10"
