[package]
name = "blocks"
version.workspace = true
edition.workspace = true
description = "Block type definitions for all Firehose chain types"

[lib]
name = "blocks"
path = "src/lib.rs"

[[bin]]
name = "fireparq"
path = "src/bin/main.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2.workspace = true
prometheus-client.workspace = true
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"
num-bigint = "0.5"
solana-vote-interface = { version = "=7.1.0", default-features = false, features = ["serde"] }

[dev-dependencies]
futures = "0.3"
parquet = { version = "60", features = ["arrow"] }
tempfile = "3"
# The Delta tests read the tables through delta-rs snapshots and VACUUM or
# checkpoint them, with exactly `firehose-parquet`'s delta-rs and object_store
# 0.13 features: no DataFusion, even in tests (`cargo tree -p blocks` lists
# none). OPTIMIZE and the maintenance job run as the `fireparq-maintenance`
# binary (`tests/common/mod.rs`).
deltalake-core = { version = "=1.0.0", default-features = false, features = ["rustls"] }
object_store_delta = { package = "object_store", version = "0.13.2", features = ["aws"] }
chrono = { version = "0.4", default-features = false }
tonic.workspace = true
tonic-prost = "0.14"
zstd = "0.14"
# `examples/bench_live_flush` serves a loopback HTTPS S3 endpoint to the real
# binary. These crates are already in the lockfile through tonic and reqwest.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
