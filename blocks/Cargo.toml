[package]
name = "blocks"
version = "0.2.5"
edition = "2021"
description = "Block type definitions for all Firehose chain types"

[lib]
name = "blocks"
path = "src/lib.rs"

[[bin]]
name = "firehose-to-parquet"
path = "src/bin/main.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2.workspace = true
