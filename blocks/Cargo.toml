[package]
name = "blocks"
version.workspace = true
edition.workspace = true
description = "Block type definitions for all Firehose chain types"

[lib]
name = "blocks"
path = "src/lib.rs"

[[bin]]
name = "fireparq"
path = "src/bin/main.rs"

[dependencies]
firehose-parquet = { path = "../firehose-parquet" }
firehose-protos = { path = "../firehose-protos" }
arrow.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2.workspace = true
prometheus-client.workspace = true
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
object_store = { version = "0.12", features = ["aws"] }
bincode = "1.3.3"
num-bigint = "0.5"
solana-vote-interface = { version = "=7.1.0", default-features = false, features = ["serde"] }

[dev-dependencies]
futures = "0.3"
parquet = { version = "60", features = ["arrow"] }
tempfile = "3"
tonic.workspace = true
tonic-prost = "0.14"
zstd = "0.14"
